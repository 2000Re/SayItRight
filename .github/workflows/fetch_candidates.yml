name: Fetch Pronunciation Candidates

# 手動実行(即時)と定期実行(自動)の両方に対応
on:
  workflow_dispatch: {}
  # schedule はGitHub Actions側の実行タイミングが不安定なため無効化。
  # 代わりに cron-job.org から毎日決まった時刻に workflow_dispatch を
  # API経由で呼び出す運用にしている。
  # schedule:
  #   - cron: "0 22 * * *"

permissions:
  contents: write

# 手動実行と cron-job.org からの自動実行が重なった場合に、同じ単語が
# 二重にアップロードされたり、used_words.json/candidates.json への
# git push が競合したりするのを防ぐため、同時実行を1本に制限する。
# (アップロード処理を中断すると中途半端な状態になりかねないため、
#  実行中のジョブをキャンセルはせず、後続はキューで待たせる)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-candidates:
    runs-on: ubuntu-latest
    # TTS/動画生成/アップロードのどこかで詰まった場合に、ジョブが
    # デフォルトの上限(最大6時間)まで張り付き続けるのを防ぐ安全弁。
    # PICK_N=3(1回の実行で3本処理)になったため、以前(PICK_N=1)の
    # 30分では正常系でもタイムアウトしかねず、余裕を持って60分にしている。
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scoring script
        run: python fetch_and_score.py

      - name: Set up GCP credentials
        run: printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$HOME/gcp-key.json"
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate audio (TTS)
        run: python generate_audio.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json

      # ブラウザ本体(~100MB超)のダウンロードをキャッシュでスキップする。
      # OS側の共有ライブラリ(--with-deps相当)はGitHub-hostedランナーが
      # ジョブごとにまっさらなVMのため、キャッシュの有無に関わらず
      # 毎回インストールする必要がある。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Generate videos
        run: python create_videos.py

      - name: Upload to YouTube
        run: python upload_videos.py
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}

      # used_words.jsonにvideo_idが10件たまるごとに、公開済みのShortsを
      # yt-dlpで取得し直して横型(16:9)の結合動画としてアップロードする。
      # 本編パイプラインとは独立した追加機能なので、失敗しても後続の
      # コミット処理はブロックしない(compile_shorts.py側で例外を吸収する)。
      - name: Compile Shorts into a regular video (every 10 videos)
        run: python compile_shorts.py
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}

      - name: Commit updated candidates and used-words list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates.json used_words.json compilation_state.json
          git diff --cached --quiet || git commit -m "chore: update pronunciation candidates"

          # git push はGitHub側の一時的な障害(Internal Server Error等)で
          # 失敗することがある。この時点で動画は既にYouTubeへアップロード
          # 済みなので、ここで諦めるとused_words.jsonへの登録だけが
          # 失われ、将来同じ単語が重複して選ばれるリスクになる。
          # そのため数回リトライする(間にpull --rebaseを挟み、他の実行が
          # 先にpushしていた場合にも追従できるようにする)。
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "git push 失敗(${attempt}回目)。リトライします。"
            sleep $((attempt * 10))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "git push が複数回失敗しました。used_words.json の更新が反映されていない" \
               "可能性があります。手動での確認・修正が必要です。"
          exit 1

      - name: Upload candidates as artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: candidates.json

      - name: Upload audio files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-output
          path: audio_output/

      - name: Upload video files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: video_output/

      - name: Upload thumbnail files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-output
          path: thumbnail_output/

      # compilation_output/ は10件たまった回にしか作られないため、
      # それ以外の日は対象ファイルなしの警告が出るだけで正常。
      - name: Upload compilation video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compilation-output
          path: compilation_output/
          if-no-files-found: ignore